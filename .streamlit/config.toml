# Tema base da UI Streamlit.
# Refinamentos (componentes, badges, sidebar) ficam em pregoes/ui/style.py.

[theme]
# Direção visual aprovada em 2026-10 (proposta "Pregões — nova direção visual").
# Cores: fonte única em style.PALETA — manter as duas em sincronia.
base = "light"
primaryColor = "#1D3F8F"              # Azul Pregões — ação principal
backgroundColor = "#F5F6F8"           # Fundo da tela
secondaryBackgroundColor = "#FFFFFF"  # Campos, cards, menu lateral
textColor = "#101828"                 # Tinta — textos
linkColor = "#1D3F8F"
borderColor = "#E4E7EC"
baseRadius = "8px"
# IBM Plex Sans/Mono (Google Fonts). Sem internet, cai na fonte do sistema.
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"

[server]
# Bind apenas no loopback: a UI NUNCA fica exposta na rede Wi-Fi local.
# Sem isso, qualquer máquina na mesma rede abriria o sistema (sem senha)
# e leria/editaria data/credenciais.json (e-mail/senha dos fornecedores +
# chave Gemini paga) e o banco. Mantém o operador como único acesso.
address = "127.0.0.1"
headless = true
runOnSave = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
# Operador leigo: nunca mostrar stacktrace cru. As telas tratam o erro
# com mensagem amigável; o detalhe técnico vai só para o log em arquivo.
showErrorDetails = "none"
toolbarMode = "minimal"
